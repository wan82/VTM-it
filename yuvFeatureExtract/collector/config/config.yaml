# ============ YUV 特征采集器配置 ============
# 全局设置（顶层标量）
output_dir: ../Data/temp/tempYuvFeature   # 相对 yuvFeatureExtract 目录（make run 的 cwd）；供 yuvLabelMerger 合并
ctu_size: 128                   # CTU 边长（边缘不足直接丢弃）
internal_bitdepth: 10           # 统一转到的内部位深（对齐 VTM 默认 10bit）
default_ctu_per_yuv: 200         # 固定条数模式：每个 YUV 默认采样多少条 CTU（可在序列里覆盖）
default_sample_ratio: 0.03          # 比例模式：>0 时改按“预估可生成×比例”采样（如 0.03 = 3%）。
                                 #   优先于 default_ctu_per_yuv；=0 时关闭、沿用固定条数。
random_seed: 42                 # 随机种子（可复现）
chroma_format: 420              # 默认色度格式 400/420/422/444（用于按帧跳过色度）

# 无用帧自动检测
detect_useless_frames: true     # 自动排除空白帧/重复帧
blank_std_threshold: 1.0        # 全帧标准差低于此 → 空白帧
duplicate_mad_threshold: 0.5    # 与前一有效帧平均绝对差低于此 → 重复帧
detect_pixel_stride: 8          # 检测时像素抽样步长（越大越快，越小越准）

# ============ 序列列表（21 个，参数取自 perSequenceCfg） ============
